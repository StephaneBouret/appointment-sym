name: Environnement PHP de CI
description: Installe PHP et les dépendances applicatives du verrou Composer.
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4 # 2.36.0
      with:
        php-version: '8.4'
        extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, pdo_mysql, pdo_sqlite, simplexml, sodium, tokenizer, xml, xmlwriter, zip
        tools: composer:2.10.2
        coverage: none
      env:
        fail-fast: 'true'
    - name: Installer les dépendances applicatives
      shell: bash
      run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
